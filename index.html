<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f3"><title>Gather — shared groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#202820;--muted:#81877c;--green:#426d4b;--green2:#e9f0e7;--paper:#f7f8f3;--white:#fff;--line:#e9ebe4;--orange:#f0a35c;--red:#b65343;--shadow:0 15px 45px #2028200c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer} .shell{min-height:100vh}.topbar{height:76px;border-bottom:1px solid var(--line);background:#ffffffd9;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1200px)/2),28px);position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:11px;font:800 22px Manrope,sans-serif;letter-spacing:-1px}.logo{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:21px}.topright{display:flex;align-items:center;gap:14px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f2e5d4;color:#7f593d;font-weight:700}.subtle{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:700;background:var(--green);color:white;transition:.15s}.btn:hover{background:#31593a;transform:translateY(-1px)}.btn.light{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;color:var(--muted);padding:9px}.btn.small{padding:9px 12px;font-size:13px}.main{max-width:1110px;margin:0 auto;padding:52px 24px 80px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-weight:700;font-size:11px}.heading{font:800 clamp(30px,4vw,42px) Manrope,sans-serif;letter-spacing:-1.8px;margin:9px 0 8px}.intro{color:var(--muted);margin:0;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:23px;margin-top:33px}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.list-card{padding:24px 26px}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.section-title{font:700 18px Manrope,sans-serif;letter-spacing:-.4px}.count{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--green2);color:var(--green);font-size:12px;margin-left:7px;padding:0 6px}.addrow{display:flex;gap:9px;margin-bottom:15px}.addrow input,.auth-card input,.joinrow input{min-width:0;flex:1;border:1px solid var(--line);border-radius:11px;padding:13px 14px;outline:none;background:#fcfcfa}.addrow input:focus,.auth-card input:focus,.joinrow input:focus{border-color:#8bad8c;box-shadow:0 0 0 3px #e9f0e7}.item{display:flex;align-items:center;gap:12px;padding:14px 3px;border-bottom:1px solid #f0f1ed}.item:last-child{border:0}.check{appearance:none;width:21px;height:21px;border:1.5px solid #cbd0c4;border-radius:7px;margin:0;flex:none;cursor:pointer;display:grid;place-items:center}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';color:white;font-size:14px;font-weight:700}.itemname{font-weight:600;flex:1}.item.done .itemname{text-decoration:line-through;color:#9da196}.qty{color:var(--muted);font-size:13px;background:#f6f7f3;padding:5px 9px;border-radius:7px}.by{font-size:11px;color:#9ca196}.del{border:0;background:transparent;color:#b1b5ac;font-size:19px;padding:4px 7px}.del:hover{color:var(--red)}.empty{text-align:center;padding:35px 10px;color:var(--muted);font-size:14px}.empty .basket{font-size:30px;margin-bottom:8px}.side{padding:22px;height:max-content}.side h3{font:700 15px Manrope;margin:0 0 16px}.members{display:flex;align-items:center;margin-bottom:18px}.member{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#f4e5d7;color:#81583e;font-size:12px;font-weight:700;border:2px solid white;margin-right:-7px}.member:nth-child(2){background:#dce9d9;color:#426d4b}.member:nth-child(3){background:#e5e1f2;color:#685993}.member-label{font-size:13px;color:var(--muted);margin-left:17px}.divider{height:1px;background:var(--line);margin:19px 0}.invite{border-radius:13px;background:#f5f7f1;padding:15px}.invite p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 12px}.joinrow{display:flex;gap:7px}.joinrow input{width:0;padding:10px;font-size:12px;text-transform:uppercase}.joinrow button{padding:9px 11px}.house-code{font:700 19px Manrope;letter-spacing:3px;color:var(--green);margin:3px 0 10px}.activity{font-size:12px;line-height:1.6;color:var(--muted)}.auth-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px}.auth-card{width:min(420px,100%);padding:35px}.auth-card .heading{font-size:30px}.auth-card form{display:grid;gap:12px;margin-top:24px}.auth-card input{width:100%}.auth-toggle{border:0;background:none;color:var(--green);font-weight:700}.auth-note{font-size:12px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 17px;border-radius:11px;background:#263b2a;color:white;font-size:13px;box-shadow:var(--shadow);z-index:9}.config{position:fixed;inset:0;background:#18201880;display:grid;place-items:center;padding:18px;z-index:10}.configbox{background:white;border-radius:18px;padding:27px;width:min(460px,100%);box-shadow:0 25px 80px #0003}.configbox h2{font:800 23px Manrope;margin:0 0 8px}.configbox p{font-size:13px;color:var(--muted);line-height:1.55}.configbox label{font-size:12px;font-weight:700;display:block;margin:15px 0 6px}.configbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px}.configactions{display:flex;gap:10px;margin-top:19px}.hidden{display:none!important}.status{font-size:12px;color:var(--muted)}@media(max-width:760px){.topbar{padding:0 19px;height:66px}.topright .subtle{display:none}.main{padding:35px 16px 55px}.layout{grid-template-columns:1fr;gap:15px}.list-card{padding:20px 17px}.side{order:-1}.side .divider,.activity{display:none}.heading{font-size:34px}.addrow .btn{padding:11px 13px}.by{display:none}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><div class="logo">⌂</div>gather<span style="color:var(--green)">.</span></div><div class="topright" id="userbar"></div></header><main id="root"></main><div id="toast" class="toast hidden"></div></div>
<script src="/app.js"></script></body></html>
